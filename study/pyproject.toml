[project]
name = "congestion"
version = "0.1.0"
description = "Causal study of NYC's January 2025 congestion toll"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==2.0.0",
  "pandas==3.1.1",
  "numpy==2.5.5",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "pyarrow==26.0.1",
  "matplotlib==3.11.2",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/congestion"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]
