name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd study && uv sync --frozen
      - run: cd study && uv run ruff check . && uv run ruff format --check .
      - run: cd study && uv run pytest -q
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -p api --noEmit && npx tsc -p infra --noEmit && npx vue-tsc -p web --noEmit
      - run: npm test -w api
      - run: npm test -w web
      - run: npm test -w infra
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: make contract
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run -w web e2e
